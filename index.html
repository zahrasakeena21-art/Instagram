<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Instagram</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .top {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #262626;
    }

    .logo {
      font-family: cursive;
      font-size: 30px;
      font-weight: bold;
    }

    /* Error screen */
    .error {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .error-icon {
      width: 60px;
      height: 60px;
      border: 3px solid white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    p {
      color: #a8a8a8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    button {
      background: #0095f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    /* Bottom navigation */
    .bottom {
      height: 60px;
      border-top: 1px solid #262626;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 24px;
    }

    .nav {
      color: white;
    }
  </style>
</head>

<body>

  <div class="phone">

    <div class="top">
      <div class="logo">Instagram</div>
    </div>

    <div class="error">

      <div class="error-icon">!</div>

      <h2>Something went wrong</h2>

      <p>
        There was a problem loading this page.
        Please try again.
      </p>

      <button onclick="tryAgain()">Try Again</button>

    </div>

    <div class="bottom">
      <div class="nav">⌂</div>
      <div class="nav">⌕</div>
      <div class="nav">＋</div>
      <div class="nav">♡</div>
      <div class="nav">◉</div>
    </div>

  </div>

  <script>
    function tryAgain() {
      alert("Something went wrong. Please try again later.");
    }
  </script>

</body>
</html>
